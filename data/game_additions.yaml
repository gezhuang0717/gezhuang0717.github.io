  pi_fh: 'Ideaaliloukun liikkeet: nopea radiaalinen ν₊, hidas magnetroniliike ν₋ ja
    aksiaalinen värähtely νz. Tässä Φ = U₀(z² − r²/2)/(2d²), νc = qB/(2πmioni), νz
