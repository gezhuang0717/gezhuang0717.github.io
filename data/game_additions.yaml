  event_width: Event σφ
  centroid_width: Centroid σφ
  turns: Turns
  relative_phase: Δφ relative to species 1
  event_limit: 3 event σφ
  missing_isomer: No matching calculable isomer
  invalid_state: Select valid ion states; unavailable states cannot fall back to the
    ground state.
  invalid_physical: Invalid physical input
  unconfined: Unconfined ideal-trap parameters
  zero_radius: Phase resolution is undefined at zero detector radius
  positive_population: Use a positive population
  invalid_time: Invalid comparison time
  separation_target: Separation target
  separation_note: σ means one event’s angular standard deviation. The search checks
    every ion pair on a 0.01 ms grid up to 5000 ms, including phase wrapping; it is
    not a fitted confidence level.
  separation_none: No accumulation time meets this target within 5000 ms.
  phase_origin: Magnetron phase origin (°)
  custom_angle: Custom angle
  centre_lines: Connect centre to spots
  phase_note: Counterclockwise angles. Changing the common origin rotates all spots;
    relative species separations stay the same. The detector drawing has a fixed 35
    mm view radius.
  total_turns: Total νc turns
  complete_turns: Complete νc turns
  delta_turns: Δ turns from first species
  residual_phase: Residual Δφ from first species (°)
  t180: First 180° separation time (ms)
  t180_target: Compare with first species
  apply180: Apply 180° time
  turn_note: The first species is the reference. Total turns = νc t; Δ turns = (νc
    − νc,ref)t. Residual angles are wrapped to [−180°, 180°). The first opposite-position
    time is 1/(2|Δνc|); equal frequencies never separate. This time is pair-specific,
    and applying it rounds to the 0.01 ms control grid. All turn counts here use known
    simulation frequencies.
  energy_hint_title: What angle corresponds to 1 keV?
  energy_hint_note: 'This is +1 keV of rest energy (mass), not kinetic energy: δm
    = 1 keV/c² = 0.00000107354410 u. With the same charge and B, δνc = −νc δm/(mion
    + δm) and δφ = 360° δνc t. Negative means lagging the reference in this counterclockwise
    convention. The result depends on the first ion and the current accumulation time;
    it is a hypothetical increment, not a measured isomer energy.'
  reference_label: Reference
  unwrapped_angle: Signed, unwrapped angle
  wrapped_angle: Residual angle in [−180°, 180°)
  pi_h: 'Relative to the common origin, νc = (φ + 2πn)/(2πt), with phase φ in radians
    and complete turns n. The simulator knows n; experiments must determine it separately.
    For rest-energy increase E at fixed charge: |Δνc|/νc = E/(mion c² + E). At small
    angles σφ ≈ σx,y/r; r is editable, initially 10.00 mm. R = 2πνc t/(2.355 σφ) is
    a FWHM resolution guide, not mass uncertainty. Longer times can make wrapped spots
    overlap again.'
  pi_fh: 'The ideal trap has fast radial motion ν₊, slow magnetron motion ν₋ and axial
    oscillation νz. Here Φ = U₀(z² − r²/2)/(2d²), νc = qB/(2πmion), νz = √(qU₀/(mion
    d²))/(2π), ν± = [νc ± √(νc² − 2νz²)]/2. Confinement requires νc² > 2νz². Ideal
    identities: ν₊ + ν₋ = νc and ν₊² + ν₋² + νz² = νc². First order: ν₋ ≈ U₀/(4πBd²).'
