  reference_label: 参考离子
  unwrapped_angle: 未回绕的有符号角度
  wrapped_angle: '[−180°,180°) 内的残余角'
  pi_h: 相对共同角度原点，νc = (φ + 2πn)/(2πt)，φ 用弧度，n 为完整圈数。仿真已知 n，真实测量需另行确定。在相同电荷下，静止能量增加
    E 时，|Δνc|/νc = E/(m离子c² + E)。小角度下 σφ ≈ σx,y/r；r 可调，初始为 10.00 mm。R = 2πνc t/(2.355
