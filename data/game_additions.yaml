  apply180: 应用 180° 时间
  turn_note: 第一种离子为参考。总圈数 = νc t；圈数差 = (νc − νc,参考)t。残余角度回绕到 [−180°,180°)。首次到达相反位置的时间为
    1/(2|Δνc|)；频率相同则不会分离。这是指定离子对的时间，应用时按 0.01 ms 控件网格取整。圈数使用仿真中的已知频率。
  energy_hint_title: 1 keV 对应多大角度？
  energy_hint_note: 这里是静止能量（质量）增加 1 keV，不是动能：δm = 1 keV/c² = 0.00000107354410 u。在相同电荷与
