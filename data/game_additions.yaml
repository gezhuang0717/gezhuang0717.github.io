  pi_fh: 理想阱包含快速径向运动 ν₊、慢速磁控运动 ν₋ 和轴向振荡 νz。这里 Φ = U₀(z² − r²/2)/(2d²)，νc = qB/(2πm离子)，νz
    = √(qU₀/(m离子d²))/(2π)，ν± = [νc ± √(νc² − 2νz²)]/2。稳定囚禁需要 νc² > 2νz²。理想关系：ν₊ +
