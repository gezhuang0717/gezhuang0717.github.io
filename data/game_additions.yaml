  custom_angle: 角度を指定
  centre_lines: 中心とスポットを結ぶ
  phase_note: 角度は反時計回りに増えます。共通の原点を変えると全スポットが回転し、イオン種間の相対分離は変わりません。検出器図の表示半径は固定の 35
    mm です。
  total_turns: νc の総周回数
  complete_turns: νc の完了周回数
  delta_turns: 第1イオン種との差（周回）
  residual_phase: 第1イオン種に対する残余 Δφ（°）
  t180: 最初に 180° 分離する時間（ms）
  t180_target: 第1イオン種と比較
  apply180: 180° の時間を適用
  turn_note: 第1イオン種が基準です。総周回数 = νc t、差 = (νc − νc,基準)t。残余角は [−180°,180°) に折り返します。最初に反対位置となる時間は
    1/(2|Δνc|) で、同じ周波数では分離しません。これは一対の時間で、適用時は 0.01 ms 刻みに丸めます。周回数は既知のシミュレーション周波数から計算します。
  energy_hint_title: 1 keV はどの角度に対応しますか？
  energy_hint_note: これは静止エネルギー（質量）が 1 keV 増加した場合で、運動エネルギーではありません。δm = 1 keV/c² = 0.00000107354410
    u。同じ電荷と B では δνc = −νc δm/(mイオン + δm)、δφ = 360° δνc t です。反時計回りの角度規約で負の値は基準より遅れることを示します。結果は第1イオンと現在の蓄積時間に依存します。仮定した増分であり、測定した異性体エネルギーではありません。
  reference_label: 基準
  unwrapped_angle: 折り返さない符号付き角度
  wrapped_angle: '[−180°,180°) の残余角'
  pi_h: 共通原点から測ると νc = (φ + 2πn)/(2πt)。φ はラジアン、n は完了周回数です。仮想実験は n を知っていますが、実測では別途決定します。同じ電荷で静止エネルギーが
    E 増加すると |Δνc|/νc = E/(mイオンc² + E)。小角度では σφ ≈ σx,y/r。調整できる r の初期値は 10.00 mm。R =
    2πνc t/(2.355 σφ) は半値全幅の分解能指標で、質量不確かさではありません。時間を延ばすと折り返すスポットが再び重なる場合があります。
  pi_fh: 理想的な運動は速い半径方向運動 ν₊、遅いマグネトロン運動 ν₋、軸方向振動 νz です。Φ = U₀(z² − r²/2)/(2d²)、νc =
    qB/(2πmイオン)、νz = √(qU₀/(mイオンd²))/(2π)、ν± = [νc ± √(νc² − 2νz²)]/2。閉じ込めには νc² >
    2νz² が必要。理想的な関係は ν₊ + ν₋ = νc、ν₊² + ν₋² + νz² = νc²。一階近似は ν₋ ≈ U₀/(4πBd²)。
