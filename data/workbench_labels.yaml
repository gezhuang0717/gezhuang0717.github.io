  mass_note: "Masses: AME2020 ground state + NUBASE2020 excitation energy. # marks extrapolated properties. Unknown uncertainty is not zero; unavailable covariance uses an explicit diagonal approximation. Ionization and molecular binding energies are omitted."
  mr_note: "Flight time scales exactly as √(mion/q); fixed electronic delay is added afterwards. Width is phenomenological: FWHM² = initial width² + (laps × broadening)². Populations are detected fractions; displayed survival does not simulate decay products."
  tof_note: "Educational TOF response: 62 + 193/√(1 + 1.876 F) µs, with 8% unconverted ions. Mixture mean TOF is population-weighted; event densities add. Synthetic noise is not an experimental calibration. Fit intervals are local Δχ² = 1 intervals and do not include mixture bias."
