  tof_note: "教学飞行时间响应：62 + 193/√(1 + 1.876 F) µs，并含 8% 未转换离子。混合平均飞行时间按占比加权，事件密度相加。模拟噪声不代表实验标定。拟合区间为局部 Δχ² = 1 区间，不包含混合偏差。"
